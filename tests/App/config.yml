framework:
  secret:          secret
  test: ~

services:

  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  test.SWouters\SqlMigrationsBundle\Private\DatabaseService: '@SWouters\SqlMigrationsBundle\Private\DatabaseService'
  test.SWouters\SqlMigrationsBundle\Private\MigrationsFilesService: '@SWouters\SqlMigrationsBundle\Private\MigrationsFilesService'
  test.SWouters\SqlMigrationsBundle\Private\MigrationTableService: '@SWouters\SqlMigrationsBundle\Private\MigrationTableService'

doctrine:
  dbal:
    driver: 'pdo_pgsql'
    url: '%env(DATABASE_URL)%'
    server_version: 14

