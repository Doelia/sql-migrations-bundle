parameters:

  env(SQL_MIGRATIONS_TABLE): '_migrations'
  env(SQL_MIGRATIONS_FOLDER): '%kernel.project_dir%/migrations'

services:

  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  SWouters\SqlMigrationsBundle\Public\Command\ExecuteMigrationsCommand:
    public: true
  SWouters\SqlMigrationsBundle\Public\Command\MarkAppliedCommand:
    public: true

  SWouters\SqlMigrationsBundle\Private\DatabaseService:
    arguments:
      $db: '@doctrine.dbal.default_connection'

  SWouters\SqlMigrationsBundle\Private\MigrationTableService:
    arguments:
      $migration_table: '%env(SQL_MIGRATIONS_TABLE)%'

  SWouters\SqlMigrationsBundle\Private\MigrationsFilesService:
    arguments:
      $folder: '%env(SQL_MIGRATIONS_FOLDER)%'

  SWouters\SqlMigrationsBundle\Public\SqlMigrationsBundleService:
    public: true
